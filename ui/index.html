<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <title>ComfyUI Live LAN View</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem('inx-theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute('content', '#e9edf6');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/inx/ui/style.css">
</head>
<body>
    <div id="bg"></div>

    <header id="topbar">
        <div id="tabs" role="tablist">
            <span id="tabIndicator"></span>
            <button id="tabGallery" class="tab-btn active" role="tab" onclick="switchTab('gallery')">Gallery</button>
            <button id="tabLive" class="tab-btn" role="tab" onclick="switchTab('live')">Live</button>
            <button id="tabPrompt" class="tab-btn" role="tab" onclick="switchTab('prompt')">Settings</button>
        </div>
        <button id="themeToggle" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle light and dark mode">
            <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.4"></circle>
                <path d="M12 2.4v2.2M12 19.4v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"></path>
            </svg>
            <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a7 7 0 0 0 9.9 9.9z"></path>
            </svg>
        </button>
    </header>

    <main id="viewer">
        <div id="status">Connecting...</div>
        <img id="display" src="" alt="Served Image" style="display:none;">
        <div id="placeholder">No images available</div>
    </main>

    <section id="promptContainer">
        <div class="acc-item" data-acc="prompt" id="promptSection">
            <button class="acc-header" type="button" aria-expanded="false" onclick="toggleAccordion('prompt')">
                <span class="acc-title">Prompt</span>
                <span id="promptBadge" class="badge">Default</span>
                <svg class="acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <div class="acc-body">
                <div class="acc-body-inner">
                    <div id="defaultPromptBox">
                        <div id="defaultPromptTitle">Workflow Default</div>
                        <div id="defaultPromptText"></div>
                    </div>
                    <textarea id="promptInput" placeholder="Enter custom prompt text here..."></textarea>
                    <div class="prompt-actions">
                        <button id="revertBtn" class="btn" onclick="revertText()" style="flex: 1;" disabled>Revert to default</button>
                        <button id="saveBtn" class="btn btn-save" onclick="saveText()" style="flex: 1;">Save</button>
                    </div>
                    <div id="promptNotice"></div>
                </div>
            </div>
        </div>

        <div class="acc-item" id="seedSection" data-acc="seed">
            <button class="acc-header" type="button" aria-expanded="false" onclick="toggleAccordion('seed')">
                <span class="acc-title">Seed (rgthree)</span>
                <span id="seedBadge" class="badge">Default</span>
                <svg class="acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <div class="acc-body">
                <div class="acc-body-inner">
                    <div id="seedList" class="seed-list"></div>
                </div>
            </div>
        </div>

        <div class="acc-item" data-acc="resolution" id="resolutionSection">
            <button class="acc-header" type="button" aria-expanded="false" onclick="toggleAccordion('resolution')">
                <span class="acc-title">Resolution</span>
                <span id="resBadge" class="badge">1:1 &middot; 1.5 MP</span>
                <svg class="acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <div class="acc-body">
                <div class="acc-body-inner">
                    <div class="res-field" id="resAutoFields">
                        <label class="field-label" for="resAspect">Aspect Ratio</label>
                        <select id="resAspect" class="select" onchange="onResolutionChange()">
                            <option value="1:1">1:1</option>
                            <option value="2:3">2:3</option>
                            <option value="3:2">3:2</option>
                            <option value="3:4">3:4</option>
                            <option value="4:3">4:3</option>
                            <option value="9:16">9:16</option>
                            <option value="16:9">16:9</option>
                            <option value="21:9">21:9</option>
                        </select>
                        <div class="field-row">
                            <label class="field-label" for="resMp">Megapixels</label>
                            <span id="resMpValue" class="field-value">1.5 MP</span>
                        </div>
                        <input type="range" id="resMp" class="slider" min="0.5" max="2" step="0.5" value="1.5" oninput="onResolutionChange()">
                    </div>

                    <label class="checkbox-row">
                        <input type="checkbox" id="resCustom" onchange="onResolutionChange()">
                        <span>Custom</span>
                    </label>

                    <div class="res-field" id="resCustomFields" style="display:none;">
                        <div class="res-wh-row">
                            <input type="number" id="resWidth" class="res-input" min="16" max="8192" step="8" value="1224" oninput="onResolutionChange()" aria-label="Width">
                            <span class="res-times">&times;</span>
                            <input type="number" id="resHeight" class="res-input" min="16" max="8192" step="8" value="1224" oninput="onResolutionChange()" aria-label="Height">
                        </div>
                    </div>

                    <div class="res-preview">Preview: <span id="resPreview">1224x1224 px</span></div>
                </div>
            </div>
        </div>

        <button id="shutdownBtn" class="btn btn-danger shutdown-btn" type="button" onclick="shutdownPC()">Shutdown PC</button>
    </section>

    <footer id="controls">
        <div id="galleryBar" class="control-row">
            <div class="group">
                <button id="prevBtn" class="btn" onclick="navigate(-1)" disabled>Prev</button>
                <span id="counter">0 / 0</span>
                <button id="nextBtn" class="btn" onclick="navigate(1)" disabled>Next</button>
            </div>
            <button id="killBtn" class="btn btn-danger" onclick="killServer()">Clear</button>
        </div>
        <div id="workflowBar" class="control-row">
            <button id="runBtn" class="btn btn-primary" onclick="runOnce()" style="flex: 1;">Run</button>
            <button id="loopBtn" class="btn btn-loop" onclick="toggleLoop()" style="flex: 1.2;">Run (Instant)</button>
            <button id="cancelBtn" class="btn btn-danger" onclick="cancelExecution()" style="flex: 1;">Cancel</button>
        </div>
    </footer>

    <script src="/inx/ui/script.js"></script>
</body>
</html>
