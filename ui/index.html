<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <title>ComfyUI Live LAN View</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem('inx-theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute('content', '#e9edf6');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/inx/ui/style.css">
</head>
<body>
    <div id="bg"></div>

    <header id="topbar">
        <div id="tabs" role="tablist">
            <span id="tabIndicator"></span>
            <button id="tabGallery" class="tab-btn active" role="tab" onclick="switchTab('gallery')">Gallery</button>
            <button id="tabLive" class="tab-btn" role="tab" onclick="switchTab('live')">Live</button>
            <button id="tabPrompt" class="tab-btn" role="tab" onclick="switchTab('prompt')">Settings</button>
        </div>
        <button id="themeToggle" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle light and dark mode">
            <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.4"></circle>
                <path d="M12 2.4v2.2M12 19.4v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"></path>
            </svg>
            <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a7 7 0 0 0 9.9 9.9z"></path>
            </svg>
        </button>
    </header>

    <main id="viewer">
        <div id="status">Connecting...</div>
        <div id="progressPill">0 / 0</div>
        <div id="badges">
            <div id="resBadge" role="button" tabindex="0" title="Click to use this size for Custom Size" onclick="applyResolutionToSettings()"></div>
            <div id="upscaleBadge" role="button" tabindex="0" title="Compare original vs upscaled" onclick="openComparison()">Upscaled</div>
        </div>
        <img id="display" src="" alt="Served Image" style="display:none;">
        <div id="placeholder">No images available</div>
    </main>

    <section id="promptContainer">
        <div class="pane-title">Settings</div>
        <div class="settings-toggle-row">
            <div class="settings-toggle-label">
                <span class="settings-toggle-title">Simple Mode</span>
                <span class="settings-toggle-sub">Just the live preview and latest image</span>
            </div>
            <input id="simpleModeToggle" class="toggle-input" type="checkbox" onchange="setSimpleMode(this.checked)" aria-label="Simple Mode">
        </div>
        <div class="acc-item" data-acc="presets" id="presetsSection">
            <button class="acc-header" type="button" aria-expanded="false" onclick="toggleAccordion('presets')">
                <span class="acc-title">Presets</span>
                <span id="presetBadge" class="badge">None</span>
                <svg class="acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <div class="acc-body">
                <div class="acc-body-inner">
                    <label class="field-label" for="presetSelect">Preset</label>
                    <select id="presetSelect" class="select" onchange="onPresetSelect()"></select>
                    <div class="preset-actions">
                        <button id="presetSaveBtn" class="btn btn-primary" type="button" onclick="savePresetFlow()">Save</button>
                        <button id="presetDeleteBtn" class="btn btn-danger" type="button" onclick="deletePreset()" disabled>Delete</button>
                    </div>
                    <div id="presetNotice" class="gen-notice"></div>
                </div>
            </div>
        </div>

        <div class="acc-item" data-acc="generation" id="generationSection">
            <button class="acc-header" type="button" aria-expanded="false" onclick="toggleAccordion('generation')">
                <span class="acc-title">Generation</span>
                <span id="genBadge" class="badge">Default</span>
                <svg class="acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <div class="acc-body">
                <div class="acc-body-inner">
                    <label class="field-label" for="genText">Prompt</label>
                    <textarea id="genText" class="gen-textarea" placeholder="Positive prompt..." oninput="onSettingsChange()"></textarea>

                    <label class="field-label" for="genNegative">Negative Prompt</label>
                    <textarea id="genNegative" class="gen-textarea" placeholder="Negative prompt..." oninput="onSettingsChange()"></textarea>

                    <label class="field-label">Size</label>
                    <div class="res-field" id="resAutoFields">
                        <select id="resAspect" class="select" onchange="onSettingsChange()">
                            <option value="1:1">1:1</option>
                            <option value="2:3">2:3</option>
                            <option value="3:2">3:2</option>
                            <option value="3:4">3:4</option>
                            <option value="4:3">4:3</option>
                            <option value="9:16">9:16</option>
                            <option value="16:9">16:9</option>
                            <option value="21:9">21:9</option>
                        </select>
                        <div class="field-row">
                            <label class="field-label" for="resMp">Megapixels</label>
                            <span id="resMpValue" class="field-value">1.5 MP</span>
                        </div>
                        <input type="range" id="resMp" class="slider" min="0.5" max="2" step="0.5" value="1.5" oninput="onSettingsChange()">
                    </div>
                    <label class="checkbox-row">
                        <input type="checkbox" id="resCustom" onchange="onSettingsChange()">
                        <span>Custom size</span>
                    </label>
                    <div class="res-field" id="resCustomFields" style="display:none;">
                        <div class="res-wh-row">
                            <input type="number" id="resWidth" class="res-input" min="16" max="8192" step="8" value="1224" oninput="onSettingsChange()" aria-label="Width">
                            <span class="res-times">&times;</span>
                            <input type="number" id="resHeight" class="res-input" min="16" max="8192" step="8" value="1224" oninput="onSettingsChange()" aria-label="Height">
                        </div>
                    </div>
                    <div class="res-preview">Size: <span id="resPreview">1224x1224 px</span></div>

                    <div class="gen-grid">
                        <div class="gen-field">
                            <label class="field-label" for="genSteps">Steps</label>
                            <input type="number" id="genSteps" class="res-input" min="1" max="10000" step="1" value="20" oninput="onSettingsChange()">
                        </div>
                        <div class="gen-field">
                            <label class="field-label" for="genCfg">CFG</label>
                            <input type="number" id="genCfg" class="res-input" min="0" max="100" step="0.1" value="7" oninput="onSettingsChange()">
                        </div>
                    </div>

                    <label class="field-label" for="genSampler">Sampler</label>
                    <select id="genSampler" class="select" onchange="onSettingsChange()"></select>

                    <label class="field-label" for="genScheduler">Scheduler</label>
                    <select id="genScheduler" class="select" onchange="onSettingsChange()"></select>

                    <button id="genResetBtn" class="btn" type="button" onclick="revertSettings()">Reset to defaults</button>
                    <div id="genNotice" class="gen-notice"></div>
                </div>
            </div>
        </div>

        <div class="acc-item" id="seedSection" data-acc="seed">
            <button class="acc-header" type="button" aria-expanded="false" onclick="toggleAccordion('seed')">
                <span class="acc-title">Seed (rgthree)</span>
                <span id="seedBadge" class="badge">Default</span>
                <svg class="acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <div class="acc-body">
                <div class="acc-body-inner">
                    <div id="seedList" class="seed-list"></div>
                </div>
            </div>
        </div>

        <button id="killBtn" class="btn btn-danger clear-btn" type="button" onclick="killServer()">Clear Images</button>
        <button id="shutdownBtn" class="btn btn-danger shutdown-btn" type="button" onclick="shutdownPC()">Shutdown PC</button>
    </section>

    <footer id="controls">
        <div id="galleryBar" class="control-row">
            <button id="prevBtn" class="btn" onclick="navigate(-1)" disabled>Prev</button>
            <span id="counter">0 / 0</span>
            <button id="nextBtn" class="btn" onclick="navigate(1)" disabled>Next</button>
            <button id="saveMenuBtn" class="btn menu-btn" onclick="toggleSaveMenu(event)" aria-haspopup="true" aria-expanded="false" aria-label="Image actions">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg>
            </button>
        </div>
        <div id="saveMenu" role="menu">
            <div class="save-row">
                <button id="downloadBtn" class="btn btn-primary" onclick="downloadCurrentImage()" disabled>Save Image</button>
                <button id="downloadAllBtn" class="btn" onclick="downloadAll()" disabled>Save All</button>
            </div>
            <div class="save-row">
                <button id="reuseBtn" class="btn chip" onclick="reuseImageSettings()" disabled>Reuse Settings</button>
                <button id="copyPromptBtn" class="btn chip" onclick="copyPrompt()" disabled>Copy Prompt</button>
            </div>
            <div class="save-row">
                <button id="upscaleBtn15" class="btn" type="button" onclick="upscaleCurrentImage(1.5)" disabled>Upscale (1.5x)</button>
                <button id="upscaleBtn20" class="btn" type="button" onclick="upscaleCurrentImage(2)" disabled>Upscale (2.0x)</button>
            </div>
            <label class="checkbox-row save-meta">
                <input type="checkbox" id="stripMetadata">
                <span>Remove metadata (workflow info)</span>
            </label>
            <div class="save-row">
                <button id="deleteImageBtn" class="btn btn-danger" type="button" onclick="deleteCurrentImage()" disabled>Delete Image</button>
            </div>
        </div>
        <div id="quickMenu" class="quick-menu" role="menu" aria-hidden="true">
            <button class="quick-item" type="button" data-quick="save" title="Save Image" aria-label="Save Image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg>
            </button>
            <button class="quick-item" type="button" data-quick="delete" title="Delete Image" aria-label="Delete Image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6l1 14h10l1-14"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
            </button>
            <button class="quick-item" type="button" data-quick="upscale" title="Upscale 2.0x" aria-label="Upscale 2.0x">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>
            </button>
        </div>
        <div id="workflowBar" class="control-row">
            <button id="runBtn" class="btn btn-primary" onclick="runOnce()" style="flex: 1;">Run</button>
            <button id="loopBtn" class="btn btn-loop" onclick="toggleLoop()" style="flex: 1.4;">Run (Instant)</button>
            <button id="cancelBtn" class="btn btn-danger" onclick="cancelExecution()" style="flex: 1;">Cancel</button>
        </div>
    </footer>

    <div id="previewOverlay" class="preview-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <img id="previewImage" class="preview-image" alt="Image preview" draggable="false">
    </div>

    <div id="compareOverlay" class="compare-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="compare-stage">
            <div id="compareFrame" class="compare-frame">
                <img id="compareBefore" class="compare-img" alt="Original image" draggable="false">
                <img id="compareAfter" class="compare-img compare-after" alt="Upscaled image" draggable="false">
                <span class="compare-tag compare-tag-left">Original</span>
                <span class="compare-tag compare-tag-right">Upscaled</span>
                <div id="compareDivider" class="compare-divider">
                    <span class="compare-handle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l-4 6 4 6"></path><path d="M14 6l4 6-4 6"></path></svg>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-backdrop" onclick="onModalCancel()"></div>
        <div class="modal-card">
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalMessage" class="modal-message"></div>
            <input id="modalInput" class="modal-input" type="text" style="display:none;">
            <div class="modal-actions">
                <button id="modalCancel" class="btn modal-btn" type="button" onclick="onModalCancel()">Cancel</button>
                <button id="modalConfirm" class="btn btn-primary modal-btn" type="button" onclick="onModalConfirm()">OK</button>
            </div>
        </div>
    </div>

    <script src="/inx/ui/script.js"></script>
</body>
</html>
